version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: monthly
    # bump-downstream.yml skips chore: commits, so only a package the wiki
    # loads leads to a deploy
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    # bump-downstream.yml skips chore: commits, so only a package the wiki
    # loads leads to a deploy
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    cooldown:
      default-days: 7
