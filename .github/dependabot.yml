version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    # The two packages the wiki loads are left to be bumped by hand, so every
    # update here is a development one, which bump-downstream.yml skips
    ignore:
      - dependency-name: '@femiwiki/ooui-femiwiki-theme'
      - dependency-name: 'xeicon'
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    cooldown:
      default-days: 7
