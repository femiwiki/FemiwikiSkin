version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7
    # A development package never reaches the wiki, yet every merge here
    # rebuilds and redeploys it, so they come grouped into one pull request
    groups:
      development:
        dependency-type: development
        patterns: ['*']
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7
    # A development package never reaches the wiki, yet every merge here
    # rebuilds and redeploys it, so they come grouped into one pull request
    groups:
      development:
        dependency-type: development
        patterns: ['*']
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    cooldown:
      default-days: 7
