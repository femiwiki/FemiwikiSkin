---
name: GitHub Actions Security Analysis with zizmor 🌈
on:
  workflow_call:
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: GitHub Actions files end in .yml, other YAML files in .yaml
        run: |
          wrong=$(
            git ls-files '.github/*.yaml' 'action.yaml' '*/action.yaml'
            git ls-files '*.yml' ':!.github/*' ':!action.yml' ':!*/action.yml'
          )
          if [ -n "$wrong" ]; then echo "$wrong"; exit 1; fi
