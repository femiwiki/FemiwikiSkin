name: Quibble and Phan

on:
  workflow_call:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        mediawiki-version:
          - REL1_46
          - master
        stage:
          - phan
          # - coverage # We really need this coverage for a skin?
          - phpunit-unit
          - phpunit
          - phpunit-parallel
          - phpunit-standalone
          - npm-test
          - composer-test
          - selenium
          # - qunit
          # - api-testing
        exclude:
          # composer-test (parallel-lint, phpcs, minus-x) is MediaWiki-version
          # independent, so run it on a single version (REL1_46, which is a
          # required status check). This avoids the same phpcs annotations being
          # emitted once per version and saves CI time.
          - mediawiki-version: master
            stage: composer-test

    runs-on: ubuntu-latest
    # Only REL1_46's phan, npm-test and composer-test have to pass; the other
    # legs still report, but a failure there does not fail the required job.
    continue-on-error: >-
      ${{ !(matrix.mediawiki-version == 'REL1_46'
        && contains(fromJSON('["phan", "npm-test", "composer-test"]'), matrix.stage)) }}

    # contents: read to clone; id-token: write so the Codecov upload can
    # authenticate via OIDC instead of an upload token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # ResourcesTest loads the OOUI theme from node_modules, so every stage
      # that runs it needs the skin's npm packages; Quibble itself only
      # installs them for its Node stages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(fromJSON('["phpunit", "phpunit-parallel", "selenium"]'), matrix.stage)
        with:
          node-version: '26' # https://github.com/wikimedia/integration-config/blob/9d8562901f528c33b3eaece8b3c0169a2659abb8/dockerfiles/quibble-bookworm/Dockerfile.template#L2
          cache: npm

      - run: npm install
        if: contains(fromJSON('["phpunit", "phpunit-parallel", "selenium"]'), matrix.stage)

      - uses: femiwiki/quibble-action@2b5f2466dec6f421394630fd653445da1f86b11c # v3.0.0
        id: quibble
        with:
          stage: ${{ matrix.stage }}
          mediawiki-version: ${{ matrix.mediawiki-version }}
          # Node 26 images stop WebdriverIO's browser download midway
          # (https://github.com/puppeteer/puppeteer/issues/14957).
          quibble-docker-tag: ${{ case(matrix.stage == 'selenium', '1.21.0-s2', '') }}
          # v1 expanded the `Echo` dependency transitively via Wikimedia's
          # dependencies.yaml; main resolves from local sources only, so we pin
          # that closure explicitly to keep testing the same set of repos.
          dependencies: AntiSpoof CentralAuth Echo EventLogging MobileFrontend

      - name: Upload coverage to Codecov
        if: matrix.stage == 'coverage'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          directory: ${{ steps.quibble.outputs.coverage }}
