name: Quibble and Phan

on:
  workflow_call:

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        mediawiki-version:
          - REL1_43
        stage:
          - phan
          # - coverage # We really need this coverage for a skin?
          - phpunit-unit
          - phpunit
          - phpunit-parallel
          - phpunit-standalone
          - npm-test
          - composer-test
          - selenium
          # - qunit
          # - api-testing

    runs-on: ubuntu-latest
    # Only REL1_43's phan, npm-test and composer-test have to pass; the other
    # legs still report, but a failure there does not fail the required job.
    continue-on-error: >-
      ${{ !(matrix.mediawiki-version == 'REL1_43'
        && contains(fromJSON('["phan", "npm-test", "composer-test"]'), matrix.stage)) }}

    # contents: read to clone; id-token: write so the Codecov upload can
    # authenticate via OIDC instead of an upload token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.stage == 'phpunit' || matrix.stage == 'selenium'
        with:
          node-version: '26' # https://github.com/wikimedia/integration-config/blob/9d8562901f528c33b3eaece8b3c0169a2659abb8/dockerfiles/quibble-bookworm/Dockerfile.template#L2
          cache: npm

      - run: npm install
        if: matrix.stage == 'phpunit' || matrix.stage == 'selenium'

      - uses: femiwiki/quibble-action@6dc4f959985c9de92561d630f4092f54042e745e # v2.3.1
        id: quibble
        with:
          stage: ${{ matrix.stage }}
          mediawiki-version: ${{ matrix.mediawiki-version }}
          # phan and composer-test install our require-dev, and codesniffer >= 49
          # needs PHP >= 8.2, but REL1_43 otherwise derives PHP 8.1. Pin
          # just that to 8.2/bookworm so the dev tooling installs.
          php-version: >-
            ${{ case(contains(fromJSON('["phan", "composer-test"]'), matrix.stage), '8.2', '') }}
          debian: >-
            ${{ case(contains(fromJSON('["phan", "composer-test"]'), matrix.stage), 'bookworm', '') }}
          # v1 expanded the `Echo` dependency transitively via Wikimedia's
          # dependencies.yaml; main resolves from local sources only, so we pin
          # that closure explicitly to keep testing the same set of repos.
          dependencies: AntiSpoof CentralAuth Echo EventLogging MobileFrontend

      - name: Upload coverage to Codecov
        if: matrix.stage == 'coverage'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          directory: ${{ steps.quibble.outputs.coverage }}
