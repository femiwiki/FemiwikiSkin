name: Required

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      id-token: write

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  long-comments:
    uses: femiwiki/.github/.github/workflows/long-comments.yml@ef93d8c1f53e97717700ca68541f7be6a29f90fd
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@ef93d8c1f53e97717700ca68541f7be6a29f90fd
    permissions:
      contents: read

  required-gate:
    uses: femiwiki/.github/.github/workflows/required-gate.yml@ef93d8c1f53e97717700ca68541f7be6a29f90fd
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [test, lint, long-comments, shared-lint, required-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
