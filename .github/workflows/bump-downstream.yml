name: Bump the skin in docker-mediawiki

on:
  push:
    branches:
      - main
    # The wiki reads neither, so a push touching only these changes nothing it runs
    paths-ignore:
      - .github/**
      - tests/**
  # For a push that was skipped but should reach the wiki after all
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    # chore: is a development dependency update (see dependabot.yml) or the
    # like, which the wiki never loads; chore(i18n): still goes through
    if: "${{ github.repository_owner == 'femiwiki' && !startsWith(github.event.head_commit.message, 'chore: ') }}"
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Dispatch the bump to this commit
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/femiwiki/docker-mediawiki/dispatches \
            -f event_type=bump-extension \
            -f 'client_payload[extension]=Femiwiki' \
            -f "client_payload[sha]=${SHA}"
