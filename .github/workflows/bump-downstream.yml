name: Bump the skin in docker-mediawiki

on:
  push:
    branches:
      - main
    # The wiki reads neither, so a push touching only these changes nothing it runs
    paths-ignore:
      - .github/**
      - tests/**

permissions: {}

jobs:
  dispatch:
    if: github.repository_owner == 'femiwiki'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: peter-murray/workflow-application-token-action@d17e3a9a36850ea89f35db16c1067dd2b68ee343 # v4.0.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Dispatch the bump to this commit
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/femiwiki/docker-mediawiki/dispatches \
            -f event_type=bump-extension \
            -f 'client_payload[extension]=Femiwiki' \
            -f "client_payload[sha]=${SHA}"
