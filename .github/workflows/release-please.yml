name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please-action
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          release-type: simple
    outputs:
      tag_name: ${{ steps.release-please-action.outputs.tag_name }}
      upload_url: ${{ steps.release-please-action.outputs.upload_url }}

  upload-assets:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
    if: ${{ needs.release-please.outputs.upload_url != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26 # https://github.com/wikimedia/integration-config/blob/9d8562901f528c33b3eaece8b3c0169a2659abb8/dockerfiles/quibble-bookworm/Dockerfile.template#L2

      - name: Build project
        env:
          NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm install --omit=dev
          tar --exclude-vcs -C .. -zcvf "../${NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME}.tar.gz" "$(basename "$(pwd)")"
          mv "../${NEEDS_RELEASE_PLEASE_OUTPUTS_TAG_NAME}.tar.gz" ./

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" "./${TAG_NAME}.tar.gz" --repo "$GITHUB_REPOSITORY"
