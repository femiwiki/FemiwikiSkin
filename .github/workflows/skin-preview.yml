---
name: Skin preview

# Bakes tests/skin-preview at the PR's base and head commits into the previews
# branch, served at <commit SHA>/ and kept after the PR closes.
on:
  pull_request:
    paths:
      - .github/workflows/skin-preview.yml
      - Femiwiki.php
      - i18n/**
      - includes/**
      - package-lock.json
      - resources/**
      - skin.json
      - tests/skin-preview/**

permissions: {}

concurrency:
  group: skin-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Whole history, so the base commit is there and the lastmod line has dates.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'

      # The skin's styles load files from node_modules, which a git fetch would lack.
      - name: Pack the base and head of the skin
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/serve"
          for sha in "$BASE" "$HEAD"; do
            dir="$RUNNER_TEMP/$sha"
            mkdir -p "$dir"
            git archive --prefix=Femiwiki/ "$sha" | tar -x -C "$dir"
            (cd "$dir/Femiwiki" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
            tar -czf "$RUNNER_TEMP/serve/$sha.tar.gz" -C "$dir" Femiwiki
          done

      # The bake container reaches the runner as host.docker.internal.
      - name: Serve the packs
        run: |
          nohup python3 -m http.server 8000 --bind 0.0.0.0 \
            --directory "$RUNNER_TEMP/serve" > /dev/null 2>&1 &

      # Each commit is baked with its own specimen pages.
      - name: Point the source at the base
        env:
          SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout -q -f --detach "$SHA"
          URL="http://host.docker.internal:8000/$SHA.tar.gz" \
          SUM=$(sha256sum < "$RUNNER_TEMP/serve/$SHA.tar.gz" | cut -d' ' -f1) \
            yq -i '.config.WikvenRepositories.Femiwiki = {"tarball": strenv(URL), "sha256": strenv(SUM)}' \
            tests/skin-preview/.wikven.yaml

      - uses: chaotic-ground/wikven/actions/bake@248de7419f63cf3653400adb11425784c10751bc # v1.3.0
        with:
          source: tests/skin-preview
          output: preview/${{ github.event.pull_request.base.sha }}
          fetch-cache: 'false'

      - name: Point the source at the head
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout -q -f --detach "$SHA"
          URL="http://host.docker.internal:8000/$SHA.tar.gz" \
          SUM=$(sha256sum < "$RUNNER_TEMP/serve/$SHA.tar.gz" | cut -d' ' -f1) \
            yq -i '.config.WikvenRepositories.Femiwiki = {"tarball": strenv(URL), "sha256": strenv(SUM)}' \
            tests/skin-preview/.wikven.yaml

      - uses: chaotic-ground/wikven/actions/bake@248de7419f63cf3653400adb11425784c10751bc # v1.3.0
        with:
          source: tests/skin-preview
          output: preview/${{ github.event.pull_request.head.sha }}
          fetch-cache: 'false'

      # Tarred, as artifacts refuse the colon in Category:Specimen_pages.html.
      - name: Pack the preview
        run: tar -czf skin-preview.tar.gz -C preview .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skin-preview
          path: skin-preview.tar.gz

  # Forks and Dependabot get a read-only token, so their previews stay artifacts.
  publish:
    needs: bake
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skin-preview
          path: ${{ runner.temp }}

      - name: Unpack the preview
        run: |
          mkdir "$RUNNER_TEMP/preview"
          tar -xzf "$RUNNER_TEMP/skin-preview.tar.gz" -C "$RUNNER_TEMP/preview"

      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: previews
          folder: ${{ runner.temp }}/preview
          clean: false
          force: false
          commit-message: Bake ${{ github.event.pull_request.head.sha }}

      - name: Publish the previews branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gh workflow run publish-pages.yml --repo "$REPO" --ref main
          id=$(jq -n --arg ref "$HEAD" '{ref: $ref, environment: "skin-preview",
              auto_merge: false, required_contexts: [], transient_environment: false}' |
            gh api "repos/$REPO/deployments" --input - --jq .id)
          jq -n --arg url "$URL$HEAD/" --arg before "Before: $URL$BASE/" \
            '{state: "success", environment_url: $url, description: $before,
              auto_inactive: false}' |
            gh api "repos/$REPO/deployments/$id/statuses" --input - --silent
